      <!-- 3 Speed Motion Dash Lines -->
      <line x1="0" y1="9" x2="10" y2="9" stroke="#c66c24" stroke-width="2.8" stroke-linecap="round" />
      <line x1="4" y1="14" x2="11" y2="14" stroke="#c66c24" stroke-width="2.8" stroke-linecap="round" />
      <line x1="0" y1="19" x2="9" y2="19" stroke="#c66c24" stroke-width="2.8" stroke-linecap="round" />

      <!-- Isometric 3D Delivery Box -->
