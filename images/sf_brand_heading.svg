  <!-- Sub Divider Bar with Isometric Speed Box -->
  <g transform="translate(10, 148)">
    <!-- Left Line -->
    <line x1="20" y1="12" x2="415" y2="12" stroke="#c66c24" stroke-width="2" stroke-linecap="round" opacity="0.65" />
    
    <!-- Center Box Icon & Speed Lines -->
