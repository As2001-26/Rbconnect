        <!-- Outer Box Hexagon -->
        <path d="M 16,1 L 31,9.5 L 31,26.5 L 16,35 L 1,26.5 L 1,9.5 Z" stroke="#c66c24" stroke-width="2.8" stroke-linejoin="round" fill="#ffffff" />
        <!-- Inner Box Y Split (Top, Left, Right faces) -->
        <path d="M 16,1 L 16,18 M 1,9.5 L 16,18 L 31,9.5 M 16,18 L 16,35" stroke="#c66c24" stroke-width="2.8" stroke-linejoin="round" />
      </g>
    </g>

    <!-- Right Line -->
